<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Interactive Color Wheel</title>
<style>
  body{
    font-family: Arial, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    background:#f5f5f5;
    padding:24px 0;
    gap:20px;
  }
  svg{cursor:pointer}
  .card{
    background:white;
    border-radius:12px;
    padding:16px 20px;
    box-shadow:0 10px 20px rgba(0,0,0,0.1);
    width:260px;
  }
  .color-preview{
    width:100%;
    height:40px;
    border-radius:8px;
    margin-bottom:10px;
  }
  .label{font-weight:bold}
  .combo-card{
    width:320px;
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-bottom:12px;
  }
  .field input{
    border:1px solid #d0d0d0;
    border-radius:8px;
    padding:10px 12px;
    font-size:14px;
  }
  .field input.invalid{
    border-color:#d93025;
    background:#fff4f4;
  }
  .hint{
    color:#666;
    font-size:12px;
    margin:0 0 12px;
  }
  .combo-preview{
    width:100%;
    min-height:120px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    box-sizing:border-box;
    transition:background-color 0.2s ease, color 0.2s ease;
  }
  .combo-preview h1{
    margin:0;
    font-size:28px;
    text-align:center;
  }
</style>
</head>
<body>

<svg id="wheel" width="320" height="320" viewBox="0 0 320 320"></svg>

<div id="card" class="card" style="display:none">
  <div id="preview" class="color-preview"></div>
  <div><span class="label">Name:</span> <span id="name"></span></div>
  <div><span class="label">HEX:</span> <span id="hex"></span></div>
  <div><span class="label">HSL:</span> <span id="hsl"></span></div>
  <div><span class="label">OKLCH:</span> <span id="oklch"></span></div>
</div>

<div class="card combo-card">
  <div class="field">
    <label class="label" for="color1">Color #1</label>
    <input id="color1" type="text" value="#4f46e5" placeholder="#4f46e5 or hsl(250 73% 59%) or oklch(0.57 0.2 277)" />
  </div>
  <div class="field">
    <label class="label" for="color2">Color #2</label>
    <input id="color2" type="text" value="#ffffff" placeholder="#ffffff or hsl(0 0% 100%) or oklch(1 0 0)" />
  </div>
  <p class="hint">Use any valid CSS color value, including HEX, HSL, or OKLCH.</p>
  <div id="comboPreview" class="combo-preview">
    <h1 id="comboTitle">Color Combo</h1>
  </div>
</div>

<script>
const colors=[
{name:"Red",hex:"#ff0000",hsl:"hsl(0,100%,50%)",oklch:"oklch(0.63 0.26 29)"},
{name:"Red-Orange",hex:"#ff4000",hsl:"hsl(15,100%,50%)",oklch:"oklch(0.65 0.25 40)"},
{name:"Orange",hex:"#ff8000",hsl:"hsl(30,100%,50%)",oklch:"oklch(0.72 0.20 55)"},
{name:"Yellow-Orange",hex:"#ffbf00",hsl:"hsl(45,100%,50%)",oklch:"oklch(0.82 0.17 75)"},
{name:"Yellow",hex:"#ffff00",hsl:"hsl(60,100%,50%)",oklch:"oklch(0.97 0.21 109)"},
{name:"Yellow-Green",hex:"#80ff00",hsl:"hsl(90,100%,50%)",oklch:"oklch(0.89 0.23 136)"},
{name:"Green",hex:"#00ff00",hsl:"hsl(120,100%,50%)",oklch:"oklch(0.87 0.29 142)"},
{name:"Blue-Green",hex:"#00ffbf",hsl:"hsl(165,100%,50%)",oklch:"oklch(0.85 0.17 180)"},
{name:"Cyan",hex:"#00ffff",hsl:"hsl(180,100%,50%)",oklch:"oklch(0.91 0.15 194)"},
{name:"Blue",hex:"#0000ff",hsl:"hsl(240,100%,50%)",oklch:"oklch(0.45 0.31 264)"},
{name:"Blue-Violet",hex:"#4000ff",hsl:"hsl(255,100%,50%)",oklch:"oklch(0.49 0.28 276)"},
{name:"Violet",hex:"#8000ff",hsl:"hsl(270,100%,50%)",oklch:"oklch(0.53 0.29 293)"}
]

const svg=document.getElementById("wheel")
const color1Input=document.getElementById("color1")
const color2Input=document.getElementById("color2")
const comboPreview=document.getElementById("comboPreview")
const comboTitle=document.getElementById("comboTitle")
const cx=160
const cy=160
const r=140

function isValidColor(value){
  return CSS.supports("color", value)
}

function updateCombo(){
  const color1=color1Input.value.trim()
  const color2=color2Input.value.trim()

  const color1Valid=isValidColor(color1)
  const color2Valid=isValidColor(color2)

  color1Input.classList.toggle("invalid", !color1Valid)
  color2Input.classList.toggle("invalid", !color2Valid)

  comboPreview.style.background=color1Valid ? color1 : "#e5e7eb"
  comboTitle.style.color=color2Valid ? color2 : "#111827"
}

function polar(angle, radius){
  const rad=(angle-90)*Math.PI/180
  return {x:cx+radius*Math.cos(rad),y:cy+radius*Math.sin(rad)}
}

function slicePath(start,end){
  const p1=polar(start,r)
  const p2=polar(end,r)
  const large=end-start>180?1:0
  return `M ${cx} ${cy} L ${p1.x} ${p1.y} A ${r} ${r} 0 ${large} 1 ${p2.x} ${p2.y} Z`
}

colors.forEach((c,i)=>{
  const start=i*30
  const end=start+30

  const path=document.createElementNS("http://www.w3.org/2000/svg","path")
  path.setAttribute("d",slicePath(start,end))
  path.setAttribute("fill",c.hex)

  path.addEventListener("click",()=>showColor(c))

  svg.appendChild(path)
})

function showColor(c){
  document.getElementById("card").style.display="block"
  document.getElementById("preview").style.background=c.hex
  document.getElementById("name").textContent=c.name
  document.getElementById("hex").textContent=c.hex
  document.getElementById("hsl").textContent=c.hsl
  document.getElementById("oklch").textContent=c.oklch
}

color1Input.addEventListener("input",updateCombo)
color2Input.addEventListener("input",updateCombo)

updateCombo()
</script>

</body>
</html>
